name: Publish Package

on:
  release:
    types:
      - published

env:
  PYTHON_VERSION: '3.12'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        # deadsnakes python required due to https://github.com/JonathonReinhart/staticx/issues/188
        uses: deadsnakes/action@e640ac8743173a67cca4d7d77cd837e514bf98e8  # v3.2.0
        if: env.PYTHON_VERSION != '3.12'  # Python 3.12 is native on ubuntu-latest
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: Build the binary
        run: |
          uv sync
          uv run make -C dist clean
          uv run make -C dist release
      - name: Upload to release
        run: |
          gh release upload ${{ github.ref_name }} "dist/sagemaker-shim-`uv run python -c "from importlib.metadata import version;print(version('sagemaker-shim'))"`-`uname -s`-`uname -i`.tar.gz" "dist/checksums.txt"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-for-pypi:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build the package
        run: uv build --out-dir python-dist/
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-dist
          path: python-dist/
          if-no-files-found: error
          retention-days: 1

  deploy-to-pypi:
    # IMPORTANT: use a separate job for this as each step has access to the tokens
    needs: build-for-pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
    # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: python-dist
        path: python-dist
    - name: Publish package distributions
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
      with:
        packages-dir: python-dist/
